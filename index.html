<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Backup WA</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backup WA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f0f2f5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icona-512.png">
<style>
  /* Cornice: mostra la web app (Google Apps Script) a tutto schermo.
     Qui non ci sono chat ne' chiavi: la chiave e' nel link (#k=...), che il
     browser non manda mai a GitHub. */
  html, body { margin: 0; height: 100%; background: #f0f2f5; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  iframe { display: block; width: 100%; height: 100%; border: 0; opacity: 0;
    transition: opacity .3s; position: relative; z-index: 1; }
  iframe.pronto { opacity: 1; }
  .avvio { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    font: 15px -apple-system, sans-serif; color: #667781; }
  .avvio img { width: 112px; border-radius: 26px; box-shadow: 0 6px 20px #0002; }
  @media (prefers-color-scheme: dark) { html, body { background: #202c33; } }
  .avviso { font: 17px -apple-system, sans-serif; padding: 40px 24px; text-align: center; color: #667781; }
  .avviso img { width: 96px; border-radius: 22px; }
</style>
</head>
<body>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbzWBl0z6ZqpH6NsjCn3Q3q_-YiR1S4JdWWjPpi6YV6tXs47chLcnxQX3jv3h7QdiLlDqw/exec';
  var trovata = (location.hash.match(/k=([0-9a-f]{32})/) || [])[1];
  var chiave = trovata;
  try {
    if (trovata) localStorage.setItem('chiave', trovata);
    else chiave = localStorage.getItem('chiave');
  } catch (e) { /* senza memoria basta il link completo */ }
  if (chiave) {
    var f = document.createElement('iframe');
    f.src = APP + '?k=' + chiave;
    f.title = 'Backup WhatsApp';
    f.onload = function () { f.classList.add('pronto'); };
    document.body.insertAdjacentHTML('beforeend',
      '<div class="avvio"><img src="apple-touch-icon.png" alt=""><span>Apro le chat…</span></div>');
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="avviso"><img src="apple-touch-icon.png" alt=""><p>Link non valido.</p></div>';
  }
</script>
</body>
</html>
